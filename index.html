<!-- ===== CHECK-IN SECTION ===== -->
<div id="checkin">
  <h2>Check In</h2>

  <form id="checkin-form">
    <label for="ci-id">Student ID</label>
    <input type="text" id="ci-id" required placeholder="Enter your student ID" autocomplete="off">

    <!-- Only shown the first time a student checks in -->
    <div id="ci-new" hidden>
      <p class="ci-note">First time here? Tell us your name so we remember you.</p>
      <label for="ci-first">First name</label>
      <input type="text" id="ci-first" placeholder="First name">
      <label for="ci-last">Last name</label>
      <input type="text" id="ci-last" placeholder="Last name">
    </div>

    <button type="submit" id="ci-button">Check In</button>
  </form>

  <p id="ci-message"></p>

  <h3>Check-ins (<span id="ci-count">0</span>)</h3>
  <ul id="ci-list"></ul>
</div>

<style>
  #checkin { max-width: 400px; margin: 2rem auto; font-family: sans-serif; }
  #checkin label { display: block; margin-top: 1rem; font-weight: bold; }
  #checkin input { width: 100%; padding: .6rem; margin-top: .3rem; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
  #checkin button { margin-top: 1rem; width: 100%; padding: .75rem; border: none; border-radius: 6px; background: #2563eb; color: #fff; font-size: 1rem; cursor: pointer; }
  #checkin button:hover { background: #1d4ed8; }
  .ci-note { margin: 1rem 0 0; color: #b45309; }
  #ci-message { color: green; font-weight: bold; min-height: 1.2em; }
  #ci-list { padding-left: 1.2rem; }
  #ci-list li { margin: .4rem 0; }
  #ci-list small { color: #666; }
</style>

<script>
  (function () {
    const STUDENTS = "students";   // remembers each student: { id: {first, last} }
    const CHECKINS = "checkins";   // every check-in: [{id, time}]

    const form = document.getElementById("checkin-form");
    const idInput = document.getElementById("ci-id");
    const newBox = document.getElementById("ci-new");
    const firstInput = document.getElementById("ci-first");
    const lastInput = document.getElementById("ci-last");
    const button = document.getElementById("ci-button");
    const msg = document.getElementById("ci-message");
    const list = document.getElementById("ci-list");
    const count = document.getElementById("ci-count");

    function load(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key)) || fallback; }
      catch (e) { return fallback; }
    }
    function save(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    }

    function showNewStudentFields(show) {
      newBox.hidden = !show;
      firstInput.required = show;
      lastInput.required = show;
      button.textContent = show ? "Save & Check In" : "Check In";
    }

    function render() {
      const students = load(STUDENTS, {});
      const checkins = load(CHECKINS, []);
      count.textContent = checkins.length;
      list.innerHTML = "";
      checkins.slice().reverse().forEach(function (c) {
        const s = students[c.id] || { first: "Unknown", last: "" };
        const d = new Date(c.time);
        const li = document.createElement("li");
        li.textContent = s.first + " " + s.last + " (ID " + c.id + ") ";
        const when = document.createElement("small");
        when.textContent = "— " + d.toLocaleDateString() + " at " + d.toLocaleTimeString();
        li.appendChild(when);
        list.appendChild(li);
      });
    }

    // Hide the name fields again if they start typing a different ID
    idInput.addEventListener("input", function () {
      showNewStudentFields(false);
      msg.textContent = "";
    });

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const id = idInput.value.trim();
      if (!id) return;

      const students = load(STUDENTS, {});

      // New student: ask for first and last name before checking in
      if (!students[id]) {
        if (newBox.hidden) {
          showNewStudentFields(true);
          firstInput.focus();
          return;
        }
        const first = firstInput.value.trim();
        const last = lastInput.value.trim();
        if (!first || !last) return;
        students[id] = { first: first, last: last };
        save(STUDENTS, students);
      }

      // Check them in
      const checkins = load(CHECKINS, []);
      const now = Date.now();
      checkins.push({ id: id, time: now });
      save(CHECKINS, checkins);

      const s = students[id];
      const visits = checkins.filter(c => c.id === id).length;
      const d = new Date(now);
      const when = d.toLocaleDateString() + " at " + d.toLocaleTimeString();

      msg.textContent = visits > 1
        ? "Welcome back, " + s.first + "! Check-in #" + visits + " — " + when
        : "Welcome, " + s.first + "! You're checked in — " + when;

      form.reset();
      showNewStudentFields(false);
      idInput.focus();
      render();
    });

    render();
  })();
</script>
<!-- ===== END CHECK-IN SECTION ===== -->
