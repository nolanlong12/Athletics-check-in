<!-- ===== CHECK-IN SECTION (Supabase + login) ===== -->
<div id="checkin">
  <h2>Check In</h2>

  <!-- Step 1: enter student ID -->
  <form id="ci-id-form">
    <label for="ci-id">Student ID</label>
    <input type="text" id="ci-id" required placeholder="Enter your student ID" autocomplete="off">
    <button type="submit">Check In</button>
  </form>

  <!-- Step 3-4: ID not recognized, so log in to verify -->
  <form id="ci-login-form" hidden>
    <p class="ci-note" id="ci-login-note"></p>
    <label for="ci-email">Email</label>
    <input type="email" id="ci-email" required autocomplete="email">
    <label for="ci-password">Password</label>
    <input type="password" id="ci-password" required minlength="6" autocomplete="current-password">
    <button type="submit">Log In</button>
    <button type="button" id="ci-signup" class="ci-secondary">Create Account</button>
    <button type="button" class="ci-cancel ci-link">Use a different ID</button>
  </form>

  <!-- Step 5: confirm name, link ID to login, check in -->
  <form id="ci-name-form" hidden>
    <p class="ci-note" id="ci-name-note"></p>
    <label for="ci-first">First name</label>
    <input type="text" id="ci-first" required placeholder="First name">
    <label for="ci-last">Last name</label>
    <input type="text" id="ci-last" required placeholder="Last name">
    <button type="submit">Save &amp; Check In</button>
    <button type="button" class="ci-cancel ci-link">Cancel</button>
  </form>

  <p id="ci-message"></p>

  <h3>Check-ins (<span id="ci-count">0</span>)</h3>
  <ul id="ci-list"></ul>
</div>

<style>
  #checkin { max-width: 400px; margin: 2rem auto; font-family: sans-serif; }
  #checkin label { display: block; margin-top: 1rem; font-weight: bold; }
  #checkin input { width: 100%; padding: .6rem; margin-top: .3rem; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
  #checkin button { margin-top: 1rem; width: 100%; padding: .75rem; border: none; border-radius: 6px; background: #2563eb; color: #fff; font-size: 1rem; cursor: pointer; }
  #checkin button:hover { background: #1d4ed8; }
  #checkin button:disabled { background: #93a3c4; cursor: wait; }
  #checkin button.ci-secondary { margin-top: .5rem; background: #fff; color: #2563eb; border: 1px solid #2563eb; }
  #checkin button.ci-secondary:hover { background: #eff6ff; }
  #checkin button.ci-link { margin-top: .5rem; background: none; color: #555; text-decoration: underline; padding: .4rem; }
  .ci-note { margin: 1rem 0 0; color: #b45309; }
  #ci-message { color: green; font-weight: bold; min-height: 1.2em; }
  #ci-message.error { color: #b91c1c; }
  #ci-list { padding-left: 1.2rem; }
  #ci-list li { margin: .4rem 0; }
  #ci-list small { color: #666; }
</style>

<!-- Supabase library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  (function () {
    // ---- PUT YOUR PROJECT'S VALUES HERE ----
    // Supabase dashboard -> Project Settings -> API
    const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";
    const SUPABASE_KEY = "YOUR-ANON-OR-PUBLISHABLE-KEY";
    // -----------------------------------------

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const PENDING_KEY = "ci-pending-id"; // remembers the ID while they log in

    const idForm = document.getElementById("ci-id-form");
    const idInput = document.getElementById("ci-id");
    const loginForm = document.getElementById("ci-login-form");
    const loginNote = document.getElementById("ci-login-note");
    const emailInput = document.getElementById("ci-email");
    const passwordInput = document.getElementById("ci-password");
    const signupBtn = document.getElementById("ci-signup");
    const nameForm = document.getElementById("ci-name-form");
    const nameNote = document.getElementById("ci-name-note");
    const firstInput = document.getElementById("ci-first");
    const lastInput = document.getElementById("ci-last");
    const msg = document.getElementById("ci-message");
    const list = document.getElementById("ci-list");
    const count = document.getElementById("ci-count");

    let pendingId = null;

    // ---------- helpers ----------
    function setPending(id) {
      pendingId = id;
      try {
        if (id) sessionStorage.setItem(PENDING_KEY, id);
        else sessionStorage.removeItem(PENDING_KEY);
      } catch (e) {}
    }
    function storedPending() {
      try { return sessionStorage.getItem(PENDING_KEY); } catch (e) { return null; }
    }

    function showMessage(text, isError) {
      msg.textContent = text || "";
      msg.classList.toggle("error", !!isError);
    }

    function formatTime(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString() + " at " + d.toLocaleTimeString();
    }

    function showStep(step) {
      idForm.hidden = step !== "id";
      loginForm.hidden = step !== "login";
      nameForm.hidden = step !== "name";
      const focusMap = { id: idInput, login: emailInput, name: firstInput };
      focusMap[step].focus();
    }

    // Disable a form's buttons while saving, and show any error nicely
    async function busy(form, fn) {
      const buttons = form.querySelectorAll("button");
      buttons.forEach(b => b.disabled = true);
      try { await fn(); }
      catch (err) { showMessage(err.message || "Something went wrong.", true); }
      finally { buttons.forEach(b => b.disabled = false); }
    }

    function welcome(r) {
      const when = formatTime(r.checked_in_at);
      showMessage(r.visits > 1
        ? "Welcome back, " + r.first_name + " " + r.last_name + "! Check-in #" + r.visits + " — " + when
        : "Welcome, " + r.first_name + " " + r.last_name + "! You're checked in — " + when);
    }

    // After a check-in: sign out (shared device), clear everything, back to step 1
    async function finish() {
      setPending(null);
      idForm.reset(); loginForm.reset(); nameForm.reset();
      await db.auth.signOut();
      showStep("id");
      render();
    }

    function goToLogin() {
      loginNote.textContent = "We don't recognize ID " + pendingId +
        " yet. Please log in (or create an account) to verify who you are. You only have to do this once.";
      showStep("login");
    }

    function goToName(session) {
      nameNote.textContent = "Signed in as " + session.user.email +
        ". Enter your name to link this account to student ID " + pendingId + ".";
      showStep("name");
    }

    // ---------- Step 1-2: enter ID; recognized IDs check in right away ----------
    idForm.addEventListener("submit", function (e) {
      e.preventDefault();
      const id = idInput.value.trim();
      if (!id) return;

      busy(idForm, async function () {
        showMessage("");
        const { data, error } = await db.rpc("check_in", { p_student_id: id });
        if (error) throw error;

        if (data.status === "checked_in") {
          welcome(data);
          await finish();
          return;
        }

        // Step 3: not recognized, so they need to log in
        setPending(id);
        const { data: { session } } = await db.auth.getSession();
        if (session) goToName(session);
        else goToLogin();
      });
    });

    // ---------- Step 4: log in ----------
    loginForm.addEventListener("submit", function (e) {
      e.preventDefault();
      busy(loginForm, async function () {
        showMessage("");
        const { data, error } = await db.auth.signInWithPassword({
          email: emailInput.value.trim(),
          password: passwordInput.value
        });
        if (error) throw error;
        goToName(data.session);
      });
    });

    // ...or create an account
    signupBtn.addEventListener("click", function () {
      if (!loginForm.reportValidity()) return;
      busy(loginForm, async function () {
        showMessage("");
        const { data, error } = await db.auth.signUp({
          email: emailInput.value.trim(),
          password: passwordInput.value
        });
        if (error) throw error;
        if (!data.session) {
          // Supabase's "Confirm email" setting is on
          showMessage("Account created! Check your email to confirm it, then come back and log in. " +
                      "Your student ID (" + pendingId + ") is saved.");
          passwordInput.value = "";
          return;
        }
        goToName(data.session);
      });
    });

    // ---------- Step 5: link ID to login, save info, check in ----------
    nameForm.addEventListener("submit", function (e) {
      e.preventDefault();
      busy(nameForm, async function () {
        showMessage("");
        const { data, error } = await db.rpc("register_and_check_in", {
          p_student_id: pendingId,
          p_first_name: firstInput.value.trim(),
          p_last_name: lastInput.value.trim()
        });
        if (error) throw error;
        welcome(data);
        await finish();
      });
    });

    // Cancel buttons: start over with a different ID
    document.querySelectorAll("#checkin .ci-cancel").forEach(function (btn) {
      btn.addEventListener("click", async function () {
        setPending(null);
        idForm.reset(); loginForm.reset(); nameForm.reset();
        showMessage("");
        await db.auth.signOut();
        showStep("id");
      });
    });

    // ---------- Check-in list ----------
    async function render() {
      const { data, error, count: total } = await db
        .from("check_ins")
        .select("student_id, checked_in_at, students(first_name, last_name)", { count: "exact" })
        .order("checked_in_at", { ascending: false })
        .limit(100);

      if (error) { showMessage("Couldn't load check-ins: " + error.message, true); return; }

      count.textContent = total ?? data.length;
      list.innerHTML = "";
      data.forEach(function (c) {
        const s = c.students || { first_name: "Unknown", last_name: "" };
        const li = document.createElement("li");
        li.textContent = s.first_name + " " + s.last_name + " (ID " + c.student_id + ") ";
        const when = document.createElement("small");
        when.textContent = "— " + formatTime(c.checked_in_at);
        li.appendChild(when);
        list.appendChild(li);
      });
    }

    // Live updates: refresh the list whenever anyone checks in on any device
    db.channel("check-ins-live")
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "check_ins" }, render)
      .subscribe();

    // ---------- Start ----------
    // If they were in the middle of logging in (e.g. page reloaded), pick up where they left off
    (async function start() {
      const saved = storedPending();
      if (saved) {
        pendingId = saved;
        const { data: { session } } = await db.auth.getSession();
        if (session) goToName(session);
        else goToLogin();
      } else {
        showStep("id");
      }
      render();
    })();
  })();
</script>
<!-- ===== END CHECK-IN SECTION ===== -->
