<!-- ===== CHECK-IN SECTION ===== -->
<div id="checkin">
  <h2>Check In</h2>

  <form id="checkin-form">
    <label for="ci-id">Student ID</label>
    <input type="text" id="ci-id" required placeholder="Your student ID">

    <label for="ci-name">Name</label>
    <input type="text" id="ci-name" required placeholder="Your full name">

    <button type="submit">Check In</button>
  </form>

  <p id="ci-message"></p>

  <h3>Check-ins (<span id="ci-count">0</span>)</h3>
  <ul id="ci-list"></ul>
</div>

<style>
  #checkin { max-width: 400px; margin: 2rem auto; font-family: sans-serif; }
  #checkin label { display: block; margin-top: 1rem; font-weight: bold; }
  #checkin input { width: 100%; padding: .6rem; margin-top: .3rem; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
  #checkin button { margin-top: 1rem; width: 100%; padding: .75rem; border: none; border-radius: 6px; background: #2563eb; color: #fff; font-size: 1rem; cursor: pointer; }
  #checkin button:hover { background: #1d4ed8; }
  #ci-message { color: green; font-weight: bold; min-height: 1.2em; }
  #ci-list { padding-left: 1.2rem; }
  #ci-list li { margin: .4rem 0; }
  #ci-list small { color: #666; }
</style>

<script>
  (function () {
    const KEY = "checkins";
    const form = document.getElementById("checkin-form");
    const idInput = document.getElementById("ci-id");
    const nameInput = document.getElementById("ci-name");
    const msg = document.getElementById("ci-message");
    const list = document.getElementById("ci-list");
    const count = document.getElementById("ci-count");

    function load() {
      try { return JSON.parse(localStorage.getItem(KEY)) || []; }
      catch (e) { return []; }
    }

    function save(data) {
      try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
    }

    // When a known student ID is typed, fill in their name automatically
    idInput.addEventListener("input", function () {
      const id = idInput.value.trim();
      const match = load().find(c => c.id === id);
      if (match) nameInput.value = match.name;
    });

    function render() {
      const data = load();
      count.textContent = data.length;
      list.innerHTML = "";
      // newest first
      data.slice().reverse().forEach(function (c) {
        const d = new Date(c.time);
        const li = document.createElement("li");
        li.textContent = c.name + " (ID " + c.id + ") ";
        const when = document.createElement("small");
        when.textContent = "— " + d.toLocaleDateString() + " at " + d.toLocaleTimeString();
        li.appendChild(when);
        list.appendChild(li);
      });
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const id = idInput.value.trim();
      const name = nameInput.value.trim();
      if (!id || !name) return;

      const data = load();
      const now = Date.now();
      data.push({ id: id, name: name, time: now });
      save(data);

      const visits = data.filter(c => c.id === id).length;
      const d = new Date(now);
      const when = d.toLocaleDateString() + " at " + d.toLocaleTimeString();

      msg.textContent = visits > 1
        ? "Welcome back, " + name + "! Check-in #" + visits + " — " + when
        : "Thanks, " + name + "! You're checked in — " + when;

      form.reset();
      render();
    });

    render();
  })();
</script>
<!-- ===== END CHECK-IN SECTION ===== -->
